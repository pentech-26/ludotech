<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LudoTech</title>
<meta name="description" content="Todos los contadores de PenTech para juegos de mesa, en una sola app.">
<meta name="theme-color" content="#cfe3e6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LudoTech">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bagel Fat One";src:url(fonts/bagel-fat-one.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800;font-display:swap}

:root{
  --pared:#cfe3e6; --pared2:#bcd6da; --tinta:#14323a; --suave:#3f6570;
  --madera:#dcb87f; --madera2:#c59a5c; --canto:#a97f45; --fondo1:#9a6d42; --fondo2:#7f5631;
  --papel:#fbf6e9; --tintaPapel:#1c2b2f;
  --verde:#1f8f55; --amarillo:#ffd23f; --hueco:rgba(20,50,58,.10);
  --titulo:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --texto:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-tema="noche"]{
  --pared:#102a31; --pared2:#0b2026; --tinta:#f3ead6; --suave:#9dbcc2;
  --madera:#7a5535; --madera2:#5f3f25; --canto:#43291a; --fondo1:#3d2718; --fondo2:#2b1a10;
  --papel:#eadfc6; --tintaPapel:#1c2b2f; --hueco:rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;min-height:100dvh;background:var(--pared);color:var(--tinta);font-family:var(--texto);
  font-size:16px;line-height:1.35;overscroll-behavior-y:none;overflow-x:clip;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--tinta);outline-offset:3px;border-radius:6px}
.app{position:relative;max-width:520px;margin:0 auto;padding:10px 16px 28px}

/* Cabecera */
.barra{display:flex;justify-content:space-between;align-items:center}
.redondo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--hueco)}
.redondo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.redondo:active{transform:scale(.94)}
/* Desplegables colgados de su propio botón (idioma y tema) */
.conTema,.conIdioma{position:relative;z-index:6}
.menuTema,.menuIdioma{position:absolute;right:0;top:calc(100% + 8px);padding:6px;border-radius:14px;
  background:var(--papel);color:var(--tintaPapel);box-shadow:0 12px 30px rgba(8,24,29,.38);
  transform-origin:top right;animation:abreMenu .14s ease-out}
.menuIdioma{right:auto;left:0;transform-origin:top left}
.menuTema[hidden],.menuIdioma[hidden]{display:none}
@keyframes abreMenu{from{opacity:0;transform:scale(.88) translateY(-8px)}to{opacity:1;transform:none}}
.menuTema button,.menuIdioma button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px 11px 11px;border-radius:9px;
  font-weight:600;font-size:.95rem;color:var(--tintaPapel);white-space:nowrap;text-align:left}
.menuTema button[aria-checked="true"],.menuIdioma button[aria-checked="true"]{background:rgba(20,50,58,.11)}
.menuTema button:active,.menuIdioma button:active{background:rgba(20,50,58,.2)}
.menuTema svg,.menuIdioma svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,.sub,.filtros{position:relative;z-index:1}
h1{font-family:var(--titulo);font-weight:400;font-size:clamp(3rem,16vw,4.6rem);line-height:.9;margin:14px 0 0;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--suave);font-size:1.05rem;font-weight:500}

/* Filtros */
.filtros{display:flex;gap:8px;margin:20px 0 22px}
.filtros button{padding:9px 16px;border-radius:999px;font-weight:600;font-size:.95rem;background:var(--hueco);min-height:40px}
.filtros button[aria-pressed="true"]{background:var(--tinta);color:var(--pared)}

/* Adornos sobre el mueble: cactus de día, lámpara de lava de noche. Van detrás del título. */
.mueble{position:relative}
.adorno{position:absolute;bottom:calc(100% - 3px);z-index:0;pointer-events:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.adorno img{display:block;height:100%;width:auto}
.cactus{right:20px;height:150px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}
.lampara{right:44px;height:172px;display:none;animation:lava 4.5s ease-in-out infinite}
/* La lava: una capa recortada con la forma del cristal, con burbujas que suben y bajan a su aire */
.lava{position:absolute;inset:0;overflow:hidden;
  clip-path:polygon(35.5% 15.6%,64.5% 15.6%,78% 21%,97% 52%,96% 58%,4% 58%,3% 52%,22% 21%);
  background:linear-gradient(#9a6fd2 15%,#a45fd0 42%,#c22fcb 58%)}
.lava::after{content:"";position:absolute;inset:0;   /* brillo del cristal */
  background:linear-gradient(100deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.3) 30%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 72%,rgba(255,255,255,.16) 80%,rgba(255,255,255,0) 88%)}
.burbuja{position:absolute;left:var(--x);width:var(--t);aspect-ratio:1;translate:-50% 0;
  background:radial-gradient(circle at 38% 32%,#ff6a8c,#f0305f 55%,#d81f6e);opacity:.93;
  animation:sube var(--d) ease-in-out var(--r) infinite alternate,bambolea var(--d2) ease-in-out var(--r) infinite alternate}
@keyframes sube{from{top:52%}to{top:14%}}
@keyframes bambolea{0%{transform:translateX(calc(var(--v) * -1)) scale(1,1.12);border-radius:46% 54% 52% 48%/58% 56% 44% 42%}
  50%{transform:translateX(0) scale(1.1,.9);border-radius:54% 46% 44% 56%/46% 50% 50% 54%}
  100%{transform:translateX(var(--v)) scale(.94,1.18);border-radius:50% 50% 56% 44%/60% 44% 56% 40%}}
.lava .poso{position:absolute;left:8%;right:8%;bottom:40.500%;height:6%;border-radius:50% 50% 0 0;background:#f0305f;opacity:.93}
/* La mariposa: entra volando, se posa en la flor y se va (lo decide un temporizador con tiempos al azar) */
.mariposa{position:absolute;left:53%;top:-6px;width:26px;margin-left:-13px;opacity:0;
  transform:translate(var(--mx,90px),var(--my,-80px)) rotate(var(--mg,-18deg));
  transition:transform var(--mt,2.6s) cubic-bezier(.45,.05,.3,1),opacity .5s}
.mariposa.visible{opacity:1}
.mariposa .vuelo{animation:revolotea .7s ease-in-out infinite alternate}
.mariposa.posada .vuelo{animation:none}
@keyframes revolotea{from{transform:translate(-3px,-5px)}to{transform:translate(3px,5px)}}
.mariposa svg{display:block;width:100%;overflow:visible}
.ala{transform-box:view-box;transform-origin:20px 15px;animation:aletea .22s ease-in-out infinite alternate}
.mariposa.posada .ala{animation-duration:1.1s}
@keyframes aletea{from{transform:scaleX(1)}to{transform:scaleX(.22)}}
:root[data-tema="noche"] .cactus{display:none}
:root[data-tema="noche"] .lampara{display:block}
@keyframes lava{0%,100%{filter:drop-shadow(0 0 14px rgba(214,60,190,.45)) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
  50%{filter:drop-shadow(0 0 26px rgba(232,84,150,.75)) drop-shadow(0 3px 2px rgba(0,0,0,.5))}}

/* Intro: fondo claro que se oscurece hacia abajo, como el modo noche */
.intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  background:linear-gradient(#cfe3e6 0%,#cfe3e6 34%,#5d7f86 68%,#102a31 100%);
  transition:opacity .55s ease,visibility .55s}
.intro.fuera{opacity:0;visibility:hidden;pointer-events:none}
.introCaja{position:relative;margin-top:21vh;text-align:center}
.introTitulo{font-family:var(--titulo);font-size:clamp(3.6rem,21vw,6.2rem);line-height:.9;letter-spacing:-.01em;color:#14323a;
  opacity:0;transform:translateY(14px);animation:introSube .6s cubic-bezier(.2,.9,.3,1.15) .1s forwards}
.introFrase{margin-top:14px;font-weight:500;font-size:1.12rem;color:#3f6570;opacity:0;animation:introAparece .5s ease .55s forwards}
.introToca{margin:auto 0;padding:0 22px;max-width:22em;text-align:center;text-wrap:balance;hyphens:none;-webkit-hyphens:none;
  word-break:normal;overflow-wrap:normal;font-weight:700;font-size:1.35rem;line-height:1.3;color:#3dfb62;opacity:0;
  text-shadow:0 0 6px rgba(0,251,53,.55),0 0 18px rgba(0,214,45,.35);
  animation:introAparece .5s ease 1.3s forwards,latido 1.8s ease-in-out 1.8s infinite}
@keyframes latido{
  0%,100%{opacity:1;text-shadow:0 0 6px rgba(0,251,53,.7),0 0 20px rgba(0,214,45,.5)}
  50%{opacity:.45;text-shadow:0 0 2px rgba(0,251,53,.2),0 0 6px rgba(0,214,45,.1)}}
.introFirma{margin:0 0 30px;font-weight:600;font-size:.95rem;letter-spacing:.03em;color:rgba(243,234,214,.8);
  opacity:0;animation:introAparece .5s ease .8s forwards}
.introMeeple{position:absolute;left:0;top:0;opacity:0}
.introMeeple svg{display:block;height:100%;width:auto;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.32))}
.introLogo{position:relative;width:clamp(104px,31vw,138px);aspect-ratio:1;margin:30px auto 0;border-radius:23%;
  box-shadow:0 2px 0 rgba(255,255,255,.35) inset,0 18px 32px -6px rgba(8,24,29,.5),0 6px 12px rgba(8,24,29,.28);
  opacity:0;transform:translateY(18px) scale(.85);animation:introSube .6s cubic-bezier(.2,.9,.3,1.25) .8s forwards}
.introLogo img{display:block;width:100%;height:100%;border-radius:inherit}
.introLogo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;   /* brillo de arriba: le da volumen */
  background:linear-gradient(170deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
@keyframes introSube{to{opacity:1;transform:none}}
@keyframes introAparece{to{opacity:1}}

/* El meeple que cae sobre el título */
.meeple{position:absolute;left:0;top:0;z-index:2;opacity:0;cursor:pointer;will-change:transform;
  transform-origin:50% 50%;-webkit-touch-callout:none}
.meeple.vivo{opacity:1}
.meepleCuerpo{height:100%;transform-origin:50% 100%}
.meeple svg{display:block;height:100%;width:auto;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.32))}
/* El bocadillo de cómic que suelta el meeple. El dibujo es globo.svg; el texto va dentro del óvalo.
   La punta del rabito cae en el 25% / 76% del recuadro: ahí se apunta a la cabeza del meeple. */
.bocadillo{position:absolute;z-index:3;pointer-events:none;
  background:url(globo.svg) no-repeat center/100% 100%;
  opacity:0;transform:scale(.25);transform-origin:25% 76%;
  transition:opacity .14s ease-out,transform .3s cubic-bezier(.25,1.75,.5,1)}
.bocadillo.ver{opacity:1;transform:scale(1)}
.bocadillo span{position:absolute;left:7%;top:18%;width:71%;height:32%;
  display:grid;place-items:center;text-align:center;line-height:1;white-space:nowrap;
  font-family:var(--titulo);color:#231f20}

/* Estantería */
.estante{display:grid;grid-template-columns:1fr 1fr;border-inline:11px solid var(--madera2);border-top:11px solid var(--madera2);
  border-radius:4px 4px 0 0;background:linear-gradient(var(--pared2),var(--pared2))}
.caja{display:flex;flex-direction:column;justify-content:flex-end;text-align:left;text-decoration:none;color:inherit;min-width:0}
.hueco{padding:28px 16px 0;display:flex;align-items:flex-end;flex:1;
  /* fondo del mueble: tablas de madera más oscura, con la sombra de la balda de arriba y la del lateral */
  background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.16) 16%,rgba(0,0,0,0) 46%),
    linear-gradient(var(--lado,90deg),rgba(0,0,0,.36),rgba(0,0,0,0) 20%),
    linear-gradient(0deg,rgba(0,0,0,.22),rgba(0,0,0,0) 14%),
    repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 41px,rgba(0,0,0,.16) 41px 42px,rgba(255,255,255,.05) 42px 43px),
    linear-gradient(var(--fondo1),var(--fondo2))}
.caja:nth-child(even) .hueco{--lado:270deg}
.frente{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:5px 5px 2px 2px;container-type:inline-size;
  background:linear-gradient(155deg,var(--c1),var(--c2));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -9px 0 rgba(0,0,0,.2),inset 3px 0 0 rgba(255,255,255,.08),0 2px 0 rgba(0,0,0,.3),
    0 -3px 9px rgba(0,0,0,.28),9px 4px 14px -3px rgba(0,0,0,.5),-5px 4px 10px -4px rgba(0,0,0,.32);
  transition:transform .12s ease-out}
.caja:active .frente{transform:translateY(-6px) rotate(-1.5deg)}
.frente img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
/* sombra suave que sube desde la base de la caja, como si apoyara en la balda */
.frente::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.46),rgba(0,0,0,.2) 14%,rgba(0,0,0,.06) 30%,rgba(0,0,0,0) 44%)}
.rotulo{position:absolute;inset:0;display:flex;align-items:center;padding:0 9cqi 5cqi;font-family:var(--titulo);
  font-size:18cqi;line-height:.95;color:var(--ct,#fff);text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.pegatina{position:absolute;z-index:2;top:-10px;right:-9px;font-weight:700;font-size:.8rem;line-height:1;white-space:nowrap;
  box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pegatina.gratis{background:var(--verde);color:#fff;min-width:54px;height:54px;padding:0 7px;border-radius:50%;display:grid;place-items:center;transform:rotate(11deg)}
.pegatina.pago{background:var(--amarillo);color:#1c2b2f;padding:8px 10px 8px 16px;transform:rotate(7deg);
  clip-path:polygon(11px 0,100% 0,100% 100%,11px 100%,0 50%);box-shadow:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pegatina.activo{background:#fff;color:var(--verde);padding:7px 10px;border-radius:999px;transform:rotate(-6deg);border:2px solid var(--verde)}
.caja.pronto .frente{filter:grayscale(.75) opacity(.55)}
.balda{display:block;min-height:58px;padding:7px 9px 9px;background:linear-gradient(var(--madera),var(--madera2));
  border-bottom:4px solid var(--canto);box-shadow:0 5px 8px -4px rgba(0,0,0,.35)}
.ficha{display:flex;flex-direction:column;justify-content:center;min-height:45px;text-align:center;background:var(--papel);color:var(--tintaPapel);border-radius:3px;padding:5px 8px 6px;height:100%;
  box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ficha b{display:block;font-weight:700;font-size:.98rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ficha small{display:block;font-size:.8rem;line-height:1.2;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caja.vacia .hueco{min-height:0}
.caja.vacia .balda{flex:none}

/* Pie */
.pie{margin-top:26px;text-align:center}
.pie button{color:var(--suave);font-size:.9rem;padding:10px 14px;text-decoration:underline;text-underline-offset:3px}

/* Ventanas */
dialog{border:0;border-radius:14px;padding:0;background:var(--papel);color:var(--tintaPapel);width:min(88vw,420px);max-height:82dvh;
  box-shadow:0 18px 50px rgba(0,0,0,.45);font-family:var(--texto)}
dialog::backdrop{background:rgba(8,24,29,.6)}
.vent{padding:20px 20px 18px}
.vent h2{font-family:var(--titulo);font-weight:400;font-size:1.7rem;line-height:1;margin:0 0 14px}
.vent p{margin:0 0 10px;font-size:.95rem;line-height:1.45;user-select:text;-webkit-user-select:text}
.vent .ver{opacity:.65;font-size:.85rem}
.cerrar{display:block;width:100%;margin-top:14px;padding:13px;border-radius:10px;background:#14323a;color:#fbf6e9;font-weight:700}

/* Visor: el contador abierto dentro de la Ludoteca */
.visor{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:var(--vc,#14323a);
  padding-top:env(safe-area-inset-top)}
.visor.abierto{display:flex}
.visor iframe{flex:1;width:100%;min-height:0;border:0;display:block;background:var(--vc,#14323a)}
.visorBarra{flex:none;display:flex;justify-content:center;padding:5px 0 calc(5px + env(safe-area-inset-bottom));background:var(--vc,#14323a)}
.visorBarra button{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 16px 0 12px;border-radius:999px;
  background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:.9rem}
.visorBarra button:active{background:rgba(255,255,255,.3)}
.visorBarra svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;animation:empuja 1.3s ease-in-out infinite}
@keyframes empuja{0%,100%{transform:translateX(3px)}50%{transform:translateX(-4px)}}
.visor.clara .visorBarra button{background:rgba(20,50,58,.12);color:#14323a}
.visor.clara .visorBarra button:active{background:rgba(20,50,58,.24)}
body.conVisor{overflow:hidden}

/* Aviso breve */
.aviso{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--tinta);color:var(--pared);padding:12px 18px;border-radius:999px;font-weight:600;font-size:.95rem;max-width:88vw;text-align:center;
  transition:opacity .2s,transform .2s;z-index:5}
.aviso.ver{opacity:1;transform:translate(-50%,0)}

/* Solo vertical */
.gira{display:none;position:fixed;inset:0;z-index:9;background:var(--pared);color:var(--tinta);place-items:center;font-family:var(--titulo);font-size:2rem}
@media (orientation:landscape) and (max-height:480px){.gira{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <div class="introCaja" id="introCaja">
    <div class="introTitulo" id="introTitulo">LudoTech</div>
    <div class="introFrase" id="introFrase"></div>
    <div class="introLogo"><img src="icon-512.png" alt=""></div>
    <div class="introMeeple" id="introMeeple"></div>
  </div>
  <div class="introToca" id="introToca"></div>
  <div class="introFirma">by PenTech</div>
</div>
<div class="app">
  <div class="barra">
    <div class="conIdioma">
      <button class="redondo" id="bIdioma" type="button" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.400 5.800 12 3z"/></svg>
      </button>
      <div class="menuIdioma" id="menuIdioma" role="menu" hidden></div>
    </div>
    <div class="conTema">
      <button class="redondo" id="bTema" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div class="menuTema" id="menuTema" role="menu" hidden></div>
    </div>
  </div>
  <h1 id="titulo"></h1>

/* ---------- Almacenamiento (nunca debe romper la app) ---------- */
const mem = {
  leer(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  guardar(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const $ = id => document.getElementById(id);

/* ---------- Idioma ---------- */
function idiomaInicial(){
  // 1º lo elegido aquí; 2º lo elegido en algún contador; 3º el idioma del móvil; si no, inglés.
  for (const k of ['ludoteca-idioma','catan-idioma','rw_idioma']){
    const v = mem.leer(k);
    if (v && T[v]) return v;
  }
  const nav = (navigator.languages && navigator.languages[0] || navigator.language || 'en').slice(0,2).toLowerCase();
  return T[nav] ? nav : 'en';
}
let idioma = idiomaInicial();
let filtro = 'todos';
// Contadores que ya se han abierto alguna vez desde aquí.
let abiertos = [];
try { abiertos = JSON.parse(mem.leer('ludoteca-abiertos')) || []; } catch(e){}
if (!Array.isArray(abiertos)) abiertos = [];
const t = (k, v) => { let s = T[idioma][k]; if (v) for (const n in v) s = s.replace('{'+n+'}', v[n]); return s; };
const nombreDe = j => typeof j.nombre === 'string' ? j.nombre : (j.nombre[idioma] || j.nombre.otros);

/* ---------- Tema ---------- */
const LUNA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></svg>';
const AUTO = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>';
const SOL = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.500M12 19v2.500M2.500 12H5M19 12h2.500M5.300 5.300l1.800 1.800M16.900 16.900l1.800 1.800M5.300 18.700l1.800-1.800M16.900 7.100l1.800-1.800"/></svg>';
// Tres estados: automático (sigue al móvil), día y noche. Se guarda en 'ludoteca-tema'.
const MODOS = ['auto', 'dia', 'noche'];
let modo = mem.leer('ludoteca-tema');
if (!MODOS.includes(modo)) modo = 'auto';
const oscuroMovil = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
let tema = 'dia';                               // el modo que se está viendo ahora
const nombreModo = (m) => t((m || modo) === 'auto' ? 'tAuto' : (m || modo) === 'noche' ? 'tNoche' : 'tDia');
const iconoModo = m => m === 'auto' ? AUTO : m === 'noche' ? LUNA : SOL;
function pintarMenuTema(){
  $('menuTema').innerHTML = MODOS.map(m =>
    '<button type="button" role="menuitemradio" data-m="'+m+'" aria-checked="'+(m===modo)+'">'+
    iconoModo(m)+'<span>'+nombreModo(m)+'</span></button>').join('');
}
/* Los dos desplegables de la barra: solo puede haber uno abierto a la vez. */
const MENUS = { menuTema:'bTema', menuIdioma:'bIdioma' };
function cerrarMenu(id){ $(id).hidden = true; $(MENUS[id]).setAttribute('aria-expanded', false); }
function cerrarMenus(){ for (const id in MENUS) cerrarMenu(id); }
function abrirMenu(id, abrir){
  const m = $(id);
  if (abrir === undefined) abrir = m.hidden;
  cerrarMenus();
  if (abrir){ m.hidden = false; $(MENUS[id]).setAttribute('aria-expanded', true); }
}
function pintarMenuIdioma(){
  $('menuIdioma').innerHTML = Object.keys(IDIOMAS).map(c =>
    '<button type="button" role="menuitemradio" data-l="'+c+'" aria-checked="'+(c===idioma)+'">'+
    '<span>'+IDIOMAS[c]+'</span></button>').join('');
}
function aplicarTema(){
  tema = modo === 'auto' ? (oscuroMovil && oscuroMovil.matches ? 'noche' : 'dia') : modo;
  document.documentElement.dataset.tema = tema;
  document.querySelector('meta[name="theme-color"]').content = tema === 'noche' ? '#102a31' : '#cfe3e6';
  // El icono indica el estado actual: medio círculo, sol o luna.
  $('bTema').innerHTML = iconoModo(modo);
  $('bTema').setAttribute('aria-label', t('tema') + ': ' + nombreModo());
}

/* ---------- Licencias ---------- */
function activado(j){
  if (!j.pago || !j.lic || !j.lic.clave) return false;
  const v = mem.leer(j.lic.clave);
  return v !== null && (j.lic.valor === undefined || v === String(j.lic.valor));
}

/* ---------- Pintar ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function pintarEstante(){
  const lista = CATALOGO.filter(j => filtro === 'todos' || (filtro === 'pago') === !!j.pago);
  let html = '';
  for (const j of lista){
    const nombre = esc(nombreDe(j));
    const lista_ = !!j.url, act = activado(j);
    let pegatina = '', detalle;
    if (!lista_) detalle = t('pronto');
    else if (!j.pago){
      // Un gratuito ya abierto alguna vez se queda sin pegatina ni texto: ya se sabe que es gratis.
      if (abiertos.includes(j.id)) detalle = '';
      else { pegatina = '<span class="pegatina gratis">'+t('gratis')+'</span>'; detalle = t('libre'); }
    }
    else if (act) detalle = '';   // con la clave puesta, la caja queda limpia: ya es suyo
    else { pegatina = '<span class="pegatina pago">'+t('pago')+'</span>'; detalle = j.prueba === 1 ? t('prueba1') : t('pruebaN', {n:j.prueba}); }
    const arte = '<span class="rotulo">'+nombre+'</span>' +
      (j.icono ? '<img src="'+esc(j.icono)+'" alt="" loading="lazy" onerror="this.remove()">' : '');
    const dentro = '<span class="hueco"><span class="frente" style="--c1:'+j.c1+';--c2:'+j.c2+';--ct:'+j.ct+'">'+arte+pegatina+'</span></span>' +
      '<span class="balda"><span class="ficha"><b>'+nombre+'</b>'+(detalle ? '<small>'+detalle+'</small>' : '')+'</span></span>';
    html += lista_
      ? '<a class="caja" href="'+esc(j.url)+'" data-id="'+j.id+'" aria-label="'+esc(t('abrir',{j:nombreDe(j)}))+'">'+dentro+'</a>'
      : '<button type="button" class="caja pronto" data-id="'+j.id+'">'+dentro+'</button>';
  }
  // Si queda un hueco suelto, se cierra con un tramo de balda para que el mueble no quede cojo.
  if (lista.length % 2) html += '<span class="caja vacia" aria-hidden="true"><span class="hueco"></span><span class="balda"></span></span>';
  $('estante').innerHTML = html;
}

function pintarFiltros(){
  $('filtros').innerHTML = [['todos','todos'],['gratis','gratis'],['pago','pago']].map(([id,k]) =>
    '<button type="button" data-f="'+id+'" aria-pressed="'+(filtro===id)+'">'+t(k)+'</button>').join('');
}

/* ---------- Aviso breve ---------- */
let relojAviso;
function avisar(txt){
  const a = $('aviso'); a.textContent = txt; a.classList.add('ver');
  clearTimeout(relojAviso); relojAviso = setTimeout(() => a.classList.remove('ver'), 2200);

/* ---------- Eventos ---------- */
/* ---------- Visor ----------
   El contador se abre dentro de la Ludoteca (en un marco a pantalla completa), así el móvil
   no enseña la barra del navegador. Debajo queda una franja con el botón para volver. */
let marco = null;
function esClaro(hex){   // ¿el color pide texto oscuro encima?
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  return (r*299 + g*587 + b*114) / 1000 > 150;
}
function abrirVisor(j){
  cerrarVisor(true);
  marco = document.createElement('iframe');
  marco.src = j.url; marco.title = nombreDe(j);
  marco.allow = 'autoplay; fullscreen; clipboard-write; web-share';
  const col = j.franja || j.c2;
  $('visor').style.setProperty('--vc', col);
  $('visor').classList.toggle('clara', esClaro(col));
  $('visor').insertBefore(marco, $('visor').firstChild);
  $('visor').classList.add('abierto'); document.body.classList.add('conVisor');
  document.querySelector('meta[name="theme-color"]').content = col;
  if (!abiertos.includes(j.id)){ abiertos.push(j.id); mem.guardar('ludoteca-abiertos', JSON.stringify(abiertos)); }
  try { history.pushState({ visor:j.id }, ''); } catch(e){}   // el botón «atrás» de Android también cierra
}
function cerrarVisor(silencio){
  if (!marco) return;
  marco.remove(); marco = null;                 // al quitar el marco se paran sus sonidos
  $('visor').classList.remove('abierto'); document.body.classList.remove('conVisor');
  if (!silencio){ aplicarTema(); pintarEstante(); }   // puede haberse activado una clave
}
$('bVolver').addEventListener('click', () => {
  if (history.state && history.state.visor) history.back(); else cerrarVisor();
});
window.addEventListener('popstate', () => cerrarVisor());

$('estante').addEventListener('click', e => {
  const a = e.target.closest('a.caja');
  if (a && !e.metaKey && !e.ctrlKey){
    e.preventDefault();
    abrirVisor(CATALOGO.find(x => x.id === a.dataset.id)); return;
  }
  const c = e.target.closest('.caja.pronto'); if (!c) return;
  const j = CATALOGO.find(x => x.id === c.dataset.id);
  avisar(t('aunNo', {j:nombreDe(j)}));
});
$('filtros').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filtro = b.dataset.f; pintarFiltros(); pintarEstante();
});
$('bTema').addEventListener('click', e => { e.stopPropagation(); abrirMenu('menuTema'); });
$('menuTema').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  modo = b.dataset.m; mem.guardar('ludoteca-tema', modo);
  cerrarMenus(); aplicarTema(); pintarMenuTema();
});
document.addEventListener('click', cerrarMenus);                          // tocar fuera los cierra
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarMenus(); });
// En automático, si el móvil cambia de modo la app cambia al momento.
if (oscuroMovil && oscuroMovil.addEventListener)
  oscuroMovil.addEventListener('change', () => { if (modo === 'auto') aplicarTema(); });
$('bIdioma').addEventListener('click', e => { e.stopPropagation(); abrirMenu('menuIdioma'); });
$('menuIdioma').addEventListener('click', e => {

  idioma = b.dataset.l; mem.guardar('ludoteca-idioma', idioma);

$('bLegal').addEventListener('click', () => $('dLegal').showModal());
$('bCerrar').addEventListener('click', () => $('dLegal').close());
for (const d of document.querySelectorAll('dialog'))
  d.addEventListener('click', e => { if (e.target === d) d.close(); });   // tocar fuera cierra

// Al volver de un contador se repinta: puede haberse activado una clave.
window.addEventListener('pageshow', pintarEstante);
// Sin zoom de pellizco en iPhone.
document.addEventListener('gesturestart', e => e.preventDefault());
// Mantener pulsada una caja no abre el menú del navegador (compartir, copiar enlace...).
// En el aviso legal sí se deja, para poder copiar el texto.
document.addEventListener('contextmenu', e => { if (!e.target.closest('dialog')) e.preventDefault(); });

/* ---------- Adornos con vida ---------- */
const azar = (a, b) => a + Math.random() * (b - a);
const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// Lava: cada burbuja nace con tamaño, sitio, ritmo y desfase propios, así nunca se repite igual.
(function lava(){
  const caja = $('lava'); let html = '<div class="poso"></div>';
  for (let i = 0; i < 5; i++){
    const d = azar(9, 21);
    html += '<div class="burbuja" style="--t:'+azar(24, 46).toFixed(0)+'%;--x:'+azar(30, 70).toFixed(0)+'%;--v:'+azar(2, 7).toFixed(0)+
      'px;--d:'+d.toFixed(1)+'s;--d2:'+azar(4, 8).toFixed(1)+'s;--r:-'+azar(0, d * 2).toFixed(1)+'s"></div>';
  }
  caja.innerHTML = html;
})();

// Mariposa: espera un rato al azar, entra por un lado, se posa unos segundos y se va por el otro.
(function mariposa(){
  const m = $('mariposa'); if (quieto) return;
  const pon = (x, y, g, t) => { m.style.setProperty('--mt', t+'s'); m.style.setProperty('--mx', x+'px'); m.style.setProperty('--my', y+'px'); m.style.setProperty('--mg', g+'deg'); };
  function visita(){
    if (document.hidden || tema === 'noche'){ setTimeout(visita, 4000); return; }
    const lado = Math.random() < .5 ? 1 : -1;            // por dónde entra
    m.style.transition = 'none'; pon(lado * azar(70, 120), -azar(60, 110), lado * -20, 0);
    void m.offsetWidth; m.style.transition = '';
    const tEntra = azar(2.2, 3.2), tPosada = azar(4, 9), tSale = azar(2, 3);
    m.classList.add('visible'); pon(0, 0, 0, tEntra);
    setTimeout(() => m.classList.add('posada'), tEntra * 1000);
    setTimeout(() => {
      m.classList.remove('posada'); pon(-lado * azar(80, 140), -azar(70, 120), -lado * -20, tSale);
      setTimeout(() => m.classList.remove('visible'), tSale * 1000 - 500);
      setTimeout(visita, (tSale + azar(8, 22)) * 1000);
    }, (tEntra + tPosada) * 1000);
  }
  setTimeout(visita, azar(2500, 6000));
})();

/* ---------- El meeple que cae sobre el título ----------
   Física de verdad: gravedad, rebotes que pierden fuerza, rozamiento y volteretas.
   El recorrido se mide sobre el ancho real del título, así vale en cualquier pantalla. */
const FIS = { g:2800, rebote:.52, roce:.86, giro:.58, alto:.56 };
let relojMeeple = 0, relojHola = 0, altoMeeple = 40, anchoMeeple = 35, sitioQuieto = null;

function sitioTitulo(){
  const h = $('titulo'), app = document.querySelector('.app');
  const rh = h.getBoundingClientRect(), ra = app.getBoundingClientRect();
  const rg = document.createRange(); rg.selectNodeContents(h);
  const rt = rg.getBoundingClientRect();
  const F = parseFloat(getComputedStyle(h).fontSize);
  return { suelo: rh.top - ra.top + .115 * F,        // la raya por donde bota: justo encima de las letras
           // lo que baja al final para quedarse a horcajadas sobre los dos palos de la u
           aLaU: (.357 - .115) * F,
           izq: rt.left - ra.left, ancho: rt.width, F };
}

// Centro de una letra del título, para apoyar el meeple justo encima de ella
function letraX(i){
  const n = $('titulo').firstChild;
  if (!n || n.nodeType !== 3 || i >= n.length) return null;
  const rg = document.createRange(); rg.setStart(n, i); rg.setEnd(n, i + 1);
  const r = rg.getBoundingClientRect(), a = document.querySelector('.app').getBoundingClientRect();
  return r.left - a.left + r.width / 2;
}

const PISADA = .054;   // lo que sobra de caja por debajo de la cara frontal del meeple
const PATAS  = .083;   // desvío del punto medio entre las patas respecto al centro de la caja
function ponMeeple(x, base, ang, aplasta){
  const el = $('meeple');
  el.style.transform = 'translate(' + (x - anchoMeeple / 2).toFixed(1) + 'px,' + (base + altoMeeple * PISADA - altoMeeple).toFixed(1) + 'px)' +
    ' rotate(' + ang.toFixed(1) + 'deg)';
  el.firstElementChild.style.transform = 'scale(' + (1 + aplasta * .45).toFixed(3) + ',' + (1 - aplasta).toFixed(3) + ')';
}

/* ---------- Boing ----------
   Sonido sintetizado (sin archivos): una nota que sube con un vibrato que se apaga, como un muelle.
   Los móviles no dejan sonar nada hasta que se toca la pantalla, así que el audio se «despierta»
   con el primer toque y, si aún no se puede, el boing simplemente no suena (nunca se queda en cola). */
let audio = null;
function despiertaAudio(){
  try {
    if (!audio){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audio = new AC(); }
    if (audio.state !== 'running') audio.resume();
    const b = audio.createBuffer(1, 1, 22050), s = audio.createBufferSource();   // iOS necesita oír algo para desbloquear
    s.buffer = b; s.connect(audio.destination); s.start(0);
  } catch (e) {}
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, despiertaAudio, { capture:true, passive:true }));
function boing(fuerza = 1){
  if (!audio || audio.state !== 'running' || document.hidden) return;
  try {
    const t = audio.currentTime + .005, dura = .55;
    const vol = audio.createGain();
    vol.gain.setValueAtTime(.0001, t);
    vol.gain.exponentialRampToValueAtTime(.32 * fuerza, t + .012);
    vol.gain.exponentialRampToValueAtTime(.0001, t + dura);
    vol.connect(audio.destination);
    const lfo = audio.createOscillator(), hondo = audio.createGain();          // el «uiuiui» del muelle
    lfo.frequency.setValueAtTime(17, t); lfo.frequency.linearRampToValueAtTime(11, t + dura);
    hondo.gain.setValueAtTime(70, t); hondo.gain.exponentialRampToValueAtTime(2, t + dura);
    lfo.connect(hondo);
    [['sine', 1, 1], ['triangle', 2.01, .28]].forEach(([tipo, mult, nivel]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = tipo;
      o.frequency.setValueAtTime(150 * mult, t);
      o.frequency.exponentialRampToValueAtTime(330 * mult, t + .09);           // sube rápido…
      o.frequency.exponentialRampToValueAtTime(240 * mult, t + dura);          // …y se relaja
      hondo.connect(o.frequency);
      g.gain.value = nivel; o.connect(g); g.connect(vol);
      o.start(t); o.stop(t + dura + .02);
    });
    lfo.start(t); lfo.stop(t + dura + .02);
  } catch (e) {}
}

function tiraMeeple(){
  const el = $('meeple'); if (!el) return;
  cancelAnimationFrame(relojMeeple);
  sitioQuieto = null; $('bocadillo').classList.remove('ver');   // si vuelve a saltar, nada de bocadillo
  const { suelo, izq, ancho, F, aLaU } = sitioTitulo();
  altoMeeple = Math.max(26, Math.round(FIS.alto * F));
  anchoMeeple = altoMeeple * .865;
  el.style.height = altoMeeple + 'px';
  el.classList.add('vivo');

  const xCae = letraX(7) || izq + .88 * ancho;   // cae sobre la h, que es alta y hace de suelo
  const xFin = (letraX(1) || izq + .13 * ancho) - PATAS * anchoMeeple;   // sobre la u, un pie en cada palo
  if (quieto){ posaMeeple(xFin, suelo + aLaU, 0); return; }   // si el móvil pide no moverse, directo al final

  const PARA = 34;                           // por debajo de esta velocidad ya no bota más
  let base = -altoMeeple * 1.2, x = xCae, vy = 0, vx = 0, ang = -22, w = -660, aplasta = 0, botes = 0;

  // cuánto recorre en total por cada px/s de velocidad horizontal; de ahí sale la que hace falta
  let vb = Math.sqrt(2 * FIS.g * (suelo - base)), reparto = 0, r = 1;
  for (let i = 0; i < 14; i++){
    vb *= FIS.rebote; if (vb < PARA) break;
    reparto += (2 * vb / FIS.g) * r; r *= FIS.roce;
  }
  const vxPrimero = reparto > 0 ? (xCae - xFin) / reparto : 0;

  // La física va a pasos fijos y cortos: así el recorrido sale igual aunque el móvil vaya a tirones.
  const PASO = 1 / 240;
  let resto = 0, antes = 0, fin = false;
  function tic(){
    vy += FIS.g * PASO; base += vy * PASO; x += vx * PASO; ang += w * PASO;
    aplasta = Math.max(0, aplasta - PASO * 6);
    if (base >= suelo){                      // toca las letras
      base = suelo; vy = -vy * FIS.rebote; botes++;
      aplasta = Math.min(.3, Math.abs(vy) / 900);
      vx = botes === 1 ? -vxPrimero : vx * FIS.roce;   // la voltereta lo impulsa hacia la izquierda
      w *= FIS.giro;
      if (Math.abs(vy) < PARA || botes > 13) fin = true;
    }
  }
  function paso(ts){
    if (!antes) antes = ts;
    resto += Math.min(.25, (ts - antes) / 1000); antes = ts;
    while (resto >= PASO && !fin){ tic(); resto -= PASO; }
    if (fin){ deJaDePie(x, xFin, suelo, ang, aLaU); return; }
    ponMeeple(x, base, ang, aplasta);
    relojMeeple = requestAnimationFrame(paso);
  }
  relojMeeple = requestAnimationFrame(paso);
}

// Último paso: se deja caer entre los palos de la u, se acomoda y se pone derecho
function deJaDePie(x, xFin, suelo, ang, hondo){
  const desde = ang, hasta = Math.round(ang / 360) * 360, deX = x, t0 = performance.now();
  let sonado = false;
  (function gira(ts){
    const k = Math.min(1, (ts - t0) / 520), e = 1 - Math.pow(1 - k, 3);
    if (!sonado && k >= 1 / 1.5){ sonado = true; boing(); }                 // justo cuando se encaja en la u
    const baja = hondo * (1 - Math.pow(1 - Math.min(1, k * 1.5), 2));      // la caidita final
    const brinco = k > .6 ? Math.sin((k - .6) / .4 * Math.PI) * hondo * .14 : 0;   // y su rebotito
    ponMeeple(deX + (xFin - deX) * e, suelo + baja - brinco, desde + (hasta - desde) * e, 0);
    if (k < 1) relojMeeple = requestAnimationFrame(gira);
    else { posaMeeple(xFin, suelo + hondo, hasta); tiembla(); }   // al quedarse quieto, saluda una vez
  })(performance.now());
}

function posaMeeple(x, base, ang){          // ya está quieto: a partir de aquí tiembla y saluda
  ponMeeple(x, base, ang, 0);
  sitioQuieto = { x, base, ang };
}

/* Cada cierto rato se estremece y suelta un «hola» en el idioma de la app. */
function tiembla(){
  if (!sitioQuieto || quieto || document.hidden) return;
  const { x, base, ang } = sitioQuieto, t0 = performance.now();
  (function sacude(ts){
    const k = (ts - t0) / 500;
    if (k >= 1 || !sitioQuieto){ if (sitioQuieto) ponMeeple(x, base, ang, 0); diHola(); return; }
    const fuerza = Math.sin(k * Math.PI);                       // crece y se apaga
    ponMeeple(x + Math.sin(k * 44) * 1.8 * fuerza, base - Math.abs(Math.sin(k * 22)) * 1.2 * fuerza,
              ang + Math.sin(k * 36) * 7 * fuerza, 0);
    requestAnimationFrame(sacude);
  })(performance.now());
}
const VISIBLE = 3000;                       // lo que se queda el saludo en pantalla; luego no vuelve hasta que se le lance otra vez
function diHola(){
  if (!sitioQuieto) return;
  const bo = $('bocadillo');
  $('bocadilloTexto').textContent = t('hola');
  const W = Math.round(2.05 * altoMeeple), H = Math.round(W * 139.23 / 149.53);
  bo.style.width = W + 'px'; bo.style.height = H + 'px';
  bo.style.fontSize = (W * .175).toFixed(1) + 'px';
  const cabezaX = sitioQuieto.x + anchoMeeple * .45;          // hacia dónde apunta el rabito
  const cabezaY = sitioQuieto.base - altoMeeple * .88;
  bo.style.left = (cabezaX - .25 * W).toFixed(1) + 'px';
  bo.style.top = (cabezaY - .76 * H).toFixed(1) + 'px';
  bo.classList.add('ver');
  clearTimeout(relojHola);
  relojHola = setTimeout(() => bo.classList.remove('ver'), VISIBLE);
}

$('meeple').addEventListener('click', e => { e.stopPropagation(); tiraMeeple(); });   // tocarlo lo lanza otra vez
addEventListener('resize', () => {          // al girar o cambiar de tamaño, se queda de pie en su sitio
  cancelAnimationFrame(relojMeeple); relojMeeple = 0;
  const { suelo, izq, ancho, aLaU } = sitioTitulo();
  $('bocadillo').classList.remove('ver');
  posaMeeple((letraX(1) || izq + .13 * ancho) - PATAS * anchoMeeple, suelo + aLaU, 0);
});
// se espera a que cargue la tipografía: si no, el título aún no mide lo que medirá
/* ---------- Intro ----------
   LudoTech grande, el meeple cae sobre la u con un par de botes y la frase debajo.
   Dura unos 2,8 s (tocar la salta); al irse, el meeple de la portada hace su caída. */
let introHecha = false;
function acabaIntro(){
  if (introHecha) return; introHecha = true;
  $('intro').classList.add('fuera'); aplicarTema();
  setTimeout(() => { $('intro').remove(); tiraMeeple(); }, 560);
}
function arrancaIntro(){
  const caja = $('introCaja'), tit = $('introTitulo'), m = $('introMeeple');
  document.querySelector('meta[name="theme-color"]').content = '#cfe3e6';
  m.innerHTML = $('meeple').querySelector('svg').outerHTML;
  const F = parseFloat(getComputedStyle(tit).fontSize);
  const n = tit.firstChild, rg = document.createRange(); rg.setStart(n, 1); rg.setEnd(n, 2);
  const u = rg.getBoundingClientRect(), c = caja.getBoundingClientRect();
  const alto = Math.round(.56 * F), ancho = alto * .865;
  const x = u.left - c.left + u.width / 2 - PATAS * ancho - ancho / 2;    // un pie en cada palo de la u
  const suelo = tit.offsetTop + .357 * F + alto * PISADA;   // los pies sobre la u (offsetTop: sin contar la animación de entrada)
  m.style.height = alto + 'px';
  const pon = y => { m.style.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - alto).toFixed(1) + 'px)'; };
  if (quieto){ pon(suelo); m.style.opacity = 1; }
  else setTimeout(() => {                    // cae desde arriba y da dos botes cortos
    let y = suelo - 3.2 * F, vy = 0, antes = 0, botes = 0;
    const g = 3200; m.style.opacity = 1;
    (function paso(ts){
      if (!antes) antes = ts;
      const dt = Math.min(.03, (ts - antes) / 1000); antes = ts;
      vy += g * dt; y += vy * dt;
      if (y >= suelo){ y = suelo; if (!botes) boing(); vy = -vy * .34; botes++; if (botes > 2 || Math.abs(vy) < 40){ pon(suelo); return; } }
      pon(y); requestAnimationFrame(paso);
    })(performance.now());
  }, 650);
  $('intro').addEventListener('click', acabaIntro);          // no pasa sola: se entra tocando
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') acabaIntro(); });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(arrancaIntro);
else setTimeout(arrancaIntro, 300);

aplicarIdioma();

if ('serviceWorker' in navigator && location.protocol === 'https:')
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
